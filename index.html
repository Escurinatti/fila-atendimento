<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>Fila — Atendimento</title>
<style>
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#0f1f3d; --muted:#5b6b85; --line:#dfe6f0;
    --accent:#1f5eff; --accent-ink:#1a4fd6; --soft:#eef3fb; --soft2:#e3ebf8;
    --ok:#1a8f5a; --warn:#c77d00; --danger:#d23b3b;
    --u1:#d23b3b; --u2:#ef7d1a; --u3:#1f5eff; --u4:#6b7fd7; --u5:#8a97ad; --u7:#b8c2d3; --u8:#1a8f5a; --u9:#b8c2d3;
    --shadow:0 1px 2px rgba(15,31,61,.04), 0 6px 20px rgba(15,31,61,.06);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent-ink)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:7px 13px;transition:.12s}
  button:hover{border-color:var(--accent);color:var(--accent-ink)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{background:var(--accent-ink);color:#fff}
  button.ghost{background:transparent}
  button.small{padding:4px 10px;font-size:13px}
  button.danger{color:var(--danger)} button.danger:hover{border-color:var(--danger)}
  button.ok{color:var(--ok)} button.ok:hover{border-color:var(--ok)}
  button.ia{background:#0f1f3d;border-color:#0f1f3d;color:#fff;font-weight:600}
  button.ia:hover{background:#1f2f55;color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;width:100%}
  textarea{min-height:120px;resize:vertical;line-height:1.45}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .hide{display:none!important}

  .login{min-height:100%;display:grid;place-items:center;padding:24px}
  .login .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
  .login h1{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}
  .login label{display:block;margin:14px 0 5px;font-size:13px;color:var(--muted)}
  .login .msg{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--soft)}
  .login .msg.err{color:var(--danger)} .login .msg.ok{color:var(--ok)}
  .login .links{margin-top:14px;display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .login .links a{cursor:pointer}
  .logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;vertical-align:-7px;margin-right:6px}

  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
  .hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px}
  .hrow h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center}
  .pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:#fff}
  .pill.live{color:var(--ok);border-color:currentColor} .pill.stale{color:var(--warn);border-color:currentColor} .pill.err{color:var(--danger);border-color:currentColor}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .filters select{width:auto;padding:5px 8px;font-size:13px;border-radius:9px}
  .tabs{display:flex;gap:4px;padding:0 16px 10px;overflow-x:auto}
  .tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
  .tab .n{background:var(--soft2);border-radius:999px;padding:0 7px;font-size:12px;font-weight:600}
  .tab .n.red{background:var(--danger);color:#fff}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab.on .n{background:rgba(255,255,255,.25);color:#fff} .tab.on .n.red{background:#fff;color:var(--danger)}

  .layout{display:grid;grid-template-columns:minmax(340px,440px) 1fr;min-height:calc(100vh - 96px)}
  .list{border-right:1px solid var(--line);padding:12px;overflow-y:auto;max-height:calc(100vh - 96px)}
  .detail{padding:16px 22px 80px;overflow-y:auto;max-height:calc(100vh - 96px)}
  .detail .empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:40px}
  .grp{display:flex;align-items:center;gap:8px;margin:14px 4px 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .grp .n{background:var(--soft2);border-radius:999px;padding:1px 8px;color:var(--ink);letter-spacing:0}
  .grp.red{color:var(--danger)} .grp.red .n{background:var(--danger);color:#fff}
  .grp.blue{color:var(--accent-ink)}
  details.baixo summary{cursor:pointer;list-style:none} details.baixo summary::-webkit-details-marker{display:none}
  details.baixo summary .grp{margin-bottom:4px} details.baixo summary .grp::after{content:"▸";margin-left:auto} details.baixo[open] summary .grp::after{content:"▾"}

  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 18px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:.12s}
  .card:hover{border-color:var(--accent)}
  .card.sel{outline:2px solid var(--accent);outline-offset:-1px}
  .card.red{border-color:#f3c2c2;background:#fffafa}
  .card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--ub)}
  .card .who{font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card .espera{margin-left:auto;font-size:13px;font-weight:600;white-space:nowrap}
  .card .motivo{font-size:12.5px;font-weight:600;color:var(--ub);margin-top:2px}
  .card .txt{margin:6px 0;font-size:14px;color:var(--ink);opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
  .card.dim{opacity:.6}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
  .chip.mdt{background:#e8eefc;color:#1a4fd6} .chip.cm{background:#e6f4ee;color:#166b45} .chip.it{background:#f3e9fb;color:#6b2fa0}
  .chip.lang{background:#0f1f3d;color:#fff;font-weight:600;letter-spacing:.03em}
  .chip.midia{background:var(--danger);color:#fff;font-weight:600}
  .chip.fila{background:var(--ok);color:#fff}
  .chip.pausa{border:1px dashed var(--warn);background:transparent;color:var(--warn)}
  .chip.mail{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
  .chip.compra{background:var(--ok);color:#fff}
  .janelas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .jan{font-size:12px;color:var(--muted)} .jan b{color:var(--ink);font-weight:600}
  .bar{height:4px;background:var(--soft2);border-radius:2px;margin-top:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:2px}
  .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--danger)}
  .jan.closed b{color:var(--danger)}
  .trav{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:6px;cursor:pointer;font-size:13.5px}
  .trav:hover{border-color:var(--accent)} .trav.sel{outline:2px solid var(--accent);outline-offset:-1px}
  .trav .d{margin-left:auto;font-weight:600;white-space:nowrap}

  .dhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .dhead h2{margin:0;font-size:21px;letter-spacing:-.01em}
  .back{display:none}
  .block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
  .block h3{margin:0 0 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .block h3 .sub{letter-spacing:0;text-transform:none;font-weight:500}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px} .kv .k{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding:4px 8px 6px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0}
  .st{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--soft);white-space:nowrap}
  .st.pago{background:var(--ok);color:#fff} .st.neg{background:var(--danger);color:#fff}
  .tablewrap{overflow-x:auto}
  .thread{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto;padding-right:4px}
  .msg{max-width:82%;padding:8px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
  .msg.in{align-self:flex-start;background:var(--soft);border-bottom-left-radius:4px}
  .msg.out{align-self:flex-end;background:#dce7ff;color:#0f1f3d;border-bottom-right-radius:4px}
  .msg .m{display:block;font-size:11px;opacity:.65;margin-top:4px}
  .msg.midia{border:1px dashed var(--danger);background:#fff5f5;color:var(--danger);font-weight:600}
  .msg.fila{border:1px solid var(--ok)} .msg.pend{border:1px dashed var(--ok);background:#f2fbf6}
  .day{align-self:center;font-size:11.5px;color:var(--muted);margin:8px 0 2px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px}
  .notice{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--soft);margin:8px 0}
  .notice.warn{color:#7a4d00;background:#fff7e8;border:1px solid #f1d7a3}
  .notice.bad{color:#8a1f1f;background:#fff1f1;border:1px solid #f3c2c2}
  .notice.ok{color:#0f5c37;background:#eefaf3;border:1px solid #b9e3cb}
  .acoes{display:flex;gap:8px;flex-wrap:wrap}
  .lint{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
  .lint li{padding:4px 0 4px 22px;position:relative}
  .lint li::before{content:"";position:absolute;left:4px;top:9px;width:10px;height:10px;border-radius:50%}
  .lint li.erro{color:var(--danger)} .lint li.erro::before{background:var(--danger)}
  .lint li.aviso{color:#7a4d00} .lint li.aviso::before{background:var(--warn)}
  .lint li.ok{color:var(--ok)} .lint li.ok::before{background:var(--ok)}
  .cnt{font-size:12px;color:var(--muted);display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-grid label,.lbl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .copy{cursor:pointer;border-bottom:1px dotted var(--muted)} .copy:hover{color:var(--accent-ink)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0f1f3d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);z-index:50;max-width:92vw}
  .toast.err{background:var(--danger)}

  /* IA */
  .iabox{background:#0f1f3d;color:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
  .iabox .t{font-size:12px;letter-spacing:.09em;text-transform:uppercase;opacity:.7;font-weight:700;margin-bottom:8px}
  .iabox .row input{background:#1b2c52;border-color:#2c3f6b;color:#fff}
  .iabox .row input::placeholder{color:#9fb0d3}
  .iabox button{background:#fff;color:#0f1f3d;border-color:#fff;font-weight:600}
  .iabox button.ghost{background:transparent;color:#fff;border-color:#4a5f8f}
  .iabox button.mic{width:42px;padding:7px 0;font-size:17px}
  .iabox button.mic.on{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .iabox .status{font-size:13px;margin-top:8px;opacity:.85}
  .iabox .status.err{color:#ffb4b4}
  .ptbox{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:8px;white-space:pre-wrap}
  .ptbox .l{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
  .notas{font-size:12.5px;color:#7a4d00;margin-top:6px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,31,61,.45);z-index:40;display:grid;place-items:center;padding:16px}
  .modal{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto;padding:18px 20px;box-shadow:var(--shadow)}
  .modal h2{margin:0 0 6px;font-size:18px}
  .fato{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;display:flex;gap:10px;align-items:flex-start}
  .fato .tema{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;white-space:nowrap;margin-top:3px}
  .fato .tx{flex:1;white-space:pre-wrap}

  @media (max-width: 880px){
    .layout{display:block}
    .list,.detail{max-height:none;border-right:0}
    .list.hide-m,.detail.hide-m{display:none}
    .back{display:inline-block}
    .msg{max-width:92%}
    .form-grid{grid-template-columns:1fr}
    .hrow{padding:8px 10px}
    .tabs{padding:0 10px 8px}
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   Fila de atendimento — Estágio 2 + IA
   A tela lê o Supabase com a chave PÚBLICA; o banco só devolve para
   quem está em public.admins. Escritas passam por funções do banco.
   A IA roda na função de borda "sugerir-resposta" (Claude), que devolve
   texto para a caixa; ENVIAR continua sendo pôr na fila e o n8n envia.
   ===================================================================== */
const CONFIG = {
  url: 'https://vupxofhfgqnqsbwzmndy.supabase.co',
  key: 'sb_publishable_fesL5Nm5u8PYR-YORexjXg_8DSxbCNC',
  refreshSeg: 60,
  diasPadrao: 30,
};
const sb = supabase.createClient(CONFIG.url, CONFIG.key);

const MARCA = {
  mapa_del_tarot:      { nome: 'Mapa del Tarot', curto: 'MDT', cls: 'mdt', idioma: 'es', thankyou: 'mapadeltaro.online/thank-you/', venda: 'mapadeltaro.online' },
  cartomaps:           { nome: 'Carto Maps', curto: 'Carto', cls: 'cm', idioma: 'en', thankyou: 'cartomaps.online/thank-you', venda: 'cartomaps.online' },
  atlante_delle_carte: { nome: 'Atlante delle Carte', curto: 'Atlante', cls: 'it', idioma: 'it', thankyou: '', venda: 'atlantedellecarte.com' },
};
const IDIOMA_NOME = { es: 'Español', en: 'English', pt: 'Português', it: 'Italiano', de: 'Deutsch' };
const URG_COR = { 1:'var(--u1)', 2:'var(--u2)', 3:'var(--u3)', 4:'var(--u4)', 5:'var(--u5)', 7:'var(--u7)', 8:'var(--u8)', 9:'var(--u9)' };

const S = {
  sessao: null, admin: false,
  fila: [], travados: [], erro: null,
  agoraMs: null, agoraLocalAt: null, carregadoEm: null,
  filtro: { marca: 'todas', canal: 'todos', idioma: 'todos' },
  dias: CONFIG.diasPadrao,
  sel: null, ficha: null, thread: null, fichaErro: null,
  comp: null, reemb: null,
  ia: { carregando: false, erro: null, pt: '', notas: '', instrucao: '', ouvindo: false, ultimoModo: null },
  autoIA: (() => { try { return localStorage.getItem('fila.autoIA') !== '0'; } catch { return true; } })(),
  conhecimento: null, modal: null,
  mobileDetalhe: false, timer: null, tick: null,
};

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const agoraServidor = () => S.agoraMs ? new Date(S.agoraMs + (Date.now() - S.agoraLocalAt)) : new Date();
const horasDesde = ts => (agoraServidor() - new Date(ts)) / 36e5;
function dur(h, prec = true) {
  if (h == null || isNaN(h)) return '—';
  const neg = h < 0; h = Math.abs(h);
  let s;
  if (h < 1) s = Math.round(h * 60) + ' min';
  else if (h < 48) s = prec ? Math.floor(h) + 'h' + (Math.round((h % 1) * 60) ? ' ' + String(Math.round((h % 1) * 60)).padStart(2, '0') + 'min' : '') : Math.round(h) + 'h';
  else s = (h / 24).toFixed(h / 24 < 10 ? 1 : 0).replace('.', ',') + ' d';
  return (neg ? '-' : '') + s;
}
const fmtHora = ts => ts ? new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '—';
const fmtData = ts => ts ? new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) : '—';
const fmtDataHora = ts => ts ? `${fmtData(ts)} ${fmtHora(ts)}` : '—';
const fmtDataLonga = ts => ts ? new Date(ts).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' }) : '';
const fmtValor = (v, m) => v == null ? '—' : `${Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${esc(m || '')}`;
const marcaChip = m => { const x = MARCA[m] || { curto: m || '?', cls: '' }; return `<span class="chip ${x.cls}">${esc(x.curto)}</span>`; };
const langChip = l => l ? `<span class="chip lang" title="${esc(IDIOMA_NOME[l] || l)}">${esc(l.toUpperCase())}</span>` : '';
const canalTxt = c => c === 'dm' ? 'DM' : c === 'comentario' ? 'Comentário' : c === 'comentario_publico' ? 'Comentário público' : c === 'comentario_privado' ? 'Resposta privada' : esc(c || '?');
const nomeAutor = it => it.autor ? '@' + it.autor : `id ${it.autor_id || it.conversa_id}`;
const linkIg = autor => autor ? `<a class="small" href="https://www.instagram.com/${encodeURIComponent(autor)}/" target="_blank" rel="noopener">abrir no Instagram ↗</a>` : '';
const mascararEmail = e => { if (!e || !e.includes('@')) return e || ''; const [u, d] = e.split('@'); return (u.length <= 2 ? u[0] + '*' : u[0] + '***' + u[u.length - 1]) + '@' + d; };
function toast(msg, err = false) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 7000 : 3200); }
async function copiar(txt) { try { await navigator.clipboard.writeText(txt); toast('Copiado'); } catch { toast('Não consegui copiar', true); } }

function janelas(ultimaEntrada, canal) {
  if (canal !== 'dm' || !ultimaEntrada) return null;
  const passou = horasDesde(ultimaEntrada);
  return { h24: 24 - passou, h7d: 168 - passou };
}
function janelaHtml(j) {
  if (!j) return `<div class="jan muted">Comentário: sem prazo da Meta, mas é <b>público</b>. Resposta privada ao comentário vale 7 dias.</div>`;
  const b = (rest, total, label) => {
    const pct = Math.max(0, Math.min(100, rest / total * 100));
    const cls = rest <= 0 || pct < 25 ? 'bad' : pct < 50 ? 'warn' : '';
    return `<div class="jan ${rest <= 0 ? 'closed' : ''}">${label}: <b>${rest <= 0 ? 'fechada' : dur(rest, false) + ' restantes'}</b><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div></div>`;
  };
  return `<div class="janelas">${b(j.h24, 24, '24h padrão')}${b(j.h7d, 168, '7d human_agent')}</div>`;
}
function janelaTexto(j) { if (!j) return 'comentário, sem prazo'; return j.h24 > 0 ? `DM dentro das 24h (${dur(j.h24, false)} restantes)` : j.h7d > 0 ? `DM fora das 24h, dentro dos 7 dias (${dur(j.h7d, false)})` : 'DM fora das 24h e dos 7 dias'; }

/* ---------- verificador de regras ---------- */
function lint(texto, canal, ctx) {
  const out = []; const t = texto || '';
  const linhas = t.split('\n').filter(l => l.trim() !== '').length;
  const push = (nivel, msg) => out.push({ nivel, msg });
  if (!t.trim()) { push('erro', 'Texto vazio.'); return out; }
  if (t.length > 1000) push('erro', `${t.length} caracteres. O Instagram aceita até 1000.`);
  if (/mapadeltarot\.online/i.test(t)) push('erro', 'Contém mapadeltarot.online, o domínio do vazamento. O certo é mapadeltaro.online (sem "t").');
  if (canal === 'comentario_publico') {
    if (linhas > 3) push('erro', `Comentário público com ${linhas} linhas. Máximo 3.`);
    if (/(https?:\/\/|www\.|\.(com|online|net|org|io)\b)/i.test(t)) push('erro', 'Comentário público com link ou domínio. Link só em privado.');
  }
  if (/\b(vos|contame|decime|podés|tenés|querés|acá|andá|ingresá|fijate|mirá|sabés|escribime|avisame)\b/i.test(t)) push('aviso', 'Forma "vos" (rioplatense). A marca fala "tú": cuéntame, dime, puedes, tienes, aquí.');
  if (/\b160\b/.test(t)) push('aviso', 'São 163 páginas, não 160.');
  if (/oxxo/i.test(t)) push('aviso', 'Não citar OXXO: não existe no checkout.');
  if (/(voy a procesar|proceso (el|los|tu) reembolso|te reembols|reembolso (aprobado|hecho|listo)|i('ll| will) (process|issue|send) (the |your )?refund|refund (is )?(done|processed|approved)|already refunded)/i.test(t)) push('aviso', 'Promessa de reembolso. Quem processa é a Hotmart: mande o passo a passo com o código.');
  if (/\b(chile|méxico|mexico|argentina|brasil|brazil|colombia|españa|spain|somos de|we are (from|based))\b/i.test(t)) push('aviso', 'Nunca dizer de que país a marca é, nem concordar com o país sugerido.');
  if (/(biblioteca|library|mapadeltarot\.com|magic link|enlace mágico|link mágico)/i.test(t)) push('aviso', 'Entrega é por e-mail com os arquivos, nunca a biblioteca. Se precisar de página, é a thank you.');
  if (/(te escrib(o|imos) (por privado|al correo|a tu correo)|alguien del equipo|someone (from|on) (the|our) team|i('ll| will) (email|message|write) you)/i.test(t)) push('aviso', 'Promessa de contato. Faça o envio agora, antes ou junto com esta resposta.');
  const emojis = (t.match(/\p{Extended_Pictographic}/gu) || []).length;
  if (emojis > 2) push('aviso', `${emojis} emojis. Máximo 2.`);
  if (canal === 'dm' && linhas > 8) push('aviso', `${linhas} linhas em DM. Teto sugerido: 8.`);
  if (ctx && ctx.idiomaDetectado && ctx.idiomaModelo && ctx.idiomaDetectado !== ctx.idiomaModelo) push('aviso', `A pessoa escreve em ${IDIOMA_NOME[ctx.idiomaDetectado] || ctx.idiomaDetectado} e o modelo é em ${IDIOMA_NOME[ctx.idiomaModelo] || ctx.idiomaModelo}.`);
  if (canal === 'dm' && ctx && ctx.j && ctx.j.h24 <= 0) push('aviso', ctx.j.h7d > 0 ? 'Fora das 24h: o envio só passa com a tag human_agent. Se o despachante do n8n ainda não usa a tag, vai falhar. Alternativa: e-mail.' : 'Fora das 24h e dos 7 dias: o Instagram não vai aceitar. Use e-mail e marque "Respondi por fora".');
  if (canal === 'comentario_privado') push('aviso', 'Resposta privada a comentário: vale 7 dias e o Instagram aceita só uma por comentário.');
  if (!out.length) push('ok', 'Nenhuma regra ferida.');
  return out;
}

/* ---------- auth ---------- */
async function iniciar() {
  sb.auth.onAuthStateChange(async (evento, sessao) => {
    if (evento === 'PASSWORD_RECOVERY') { S.sessao = sessao; renderNovaSenha(); return; }
    if (evento === 'SIGNED_OUT') { S.sessao = null; S.admin = false; pararTimers(); renderLogin(); return; }
    if (sessao && !S.sessao) { S.sessao = sessao; await entrar(); }
  });
  const { data } = await sb.auth.getSession();
  if (location.hash.includes('type=recovery')) return;
  if (data.session) { S.sessao = data.session; await entrar(); } else renderLogin();
}
async function entrar() {
  const { data, error } = await sb.rpc('eh_admin');
  if (error) { renderLogin(`Não consegui verificar o acesso: ${error.message}`); return; }
  if (!data) { renderSemAcesso(); return; }
  S.admin = true; renderApp(); await carregar(); iniciarTimers();
}
function renderLogin(msg, cls = 'err') {
  pararTimers();
  $('#app').innerHTML = `
  <div class="login"><div class="box">
    <h1><span class="logo">✦</span>Fila de atendimento</h1>
    <div class="muted small">Mapa del Tarot · Carto Maps</div>
    <form id="f">
      <label>E-mail</label><input id="email" type="email" autocomplete="username" required inputmode="email">
      <label>Senha</label><input id="senha" type="password" autocomplete="current-password" required>
      <div style="margin-top:16px"><button class="primary" style="width:100%" type="submit">Entrar</button></div>
    </form>
    <div class="links"><span class="muted">Só e-mail e senha</span><a id="esqueci">Esqueci a senha</a></div>
    ${msg ? `<div class="msg ${cls}">${esc(msg)}</div>` : ''}
  </div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#f button'); btn.disabled = true; btn.textContent = 'Entrando…';
    const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#senha').value });
    if (error) renderLogin(error.message === 'Invalid login credentials' ? 'E-mail ou senha não batem.' : error.message);
  };
  $('#esqueci').onclick = async () => {
    const email = $('#email').value.trim();
    if (!email) return renderLogin('Preencha o e-mail primeiro.');
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    renderLogin(error ? error.message : `Link enviado para ${email}.`, error ? 'err' : 'ok');
  };
}
function renderNovaSenha(msg) {
  $('#app').innerHTML = `
  <div class="login"><div class="box">
    <h1>Definir nova senha</h1><div class="muted small">Para ${esc(S.sessao?.user?.email || '')}</div>
    <form id="f">
      <label>Nova senha (mín. 8)</label><input id="s1" type="password" autocomplete="new-password" minlength="8" required>
      <label>Repita</label><input id="s2" type="password" autocomplete="new-password" minlength="8" required>
      <div style="margin-top:16px"><button class="primary" style="width:100%" type="submit">Salvar e entrar</button></div>
    </form>${msg ? `<div class="msg err">${esc(msg)}</div>` : ''}
  </div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    if ($('#s1').value !== $('#s2').value) return renderNovaSenha('As duas senhas não são iguais.');
    const { error } = await sb.auth.updateUser({ password: $('#s1').value });
    if (error) return renderNovaSenha(error.message);
    history.replaceState(null, '', location.pathname); await entrar();
  };
}
function renderSemAcesso() {
  pararTimers();
  $('#app').innerHTML = `<div class="login"><div class="box"><h1>Sem acesso</h1>
    <p class="small">A conta <b>${esc(S.sessao?.user?.email || '')}</b> está logada, mas não está na lista de admins. O banco não devolve nada para ela.</p>
    <button id="sair" class="primary" style="width:100%">Sair</button></div></div>`;
  $('#sair').onclick = () => sb.auth.signOut();

/* ---------- dados ---------- */
async function carregar() {
  const [f, t] = await Promise.all([sb.rpc('fila_atendimento', { p_dias: S.dias }), sb.rpc('atendimento_travados')]);
  if (f.error || t.error) { S.erro = (f.error || t.error).message; renderStatus(); return; }
  S.erro = null; S.fila = f.data || []; S.travados = t.data || [];
  const agora = S.fila[0]?.agora || S.travados[0]?.agora;
  S.agoraMs = agora ? new Date(agora).getTime() : Date.now();
  S.agoraLocalAt = Date.now(); S.carregadoEm = Date.now();
  if (S.sel) { const novo = S.fila.find(x => x.autor_id === S.sel.autor_id && x.marca === S.sel.marca && x.canal === S.sel.canal); if (novo) S.sel.item = novo; }
  renderTabs(); renderLista(); renderStatus();
  if (S.sel && !S.comp) renderDetalhe();
}
async function abrir(item) {
  S.sel = { autor_id: item.autor_id || item.conversa_id, marca: item.marca, autor: item.autor, canal: item.canal || 'dm', idioma: item.idioma, item };
  S.ficha = null; S.thread = null; S.fichaErro = null; S.comp = null; S.reemb = null;
  S.ia = { carregando: false, erro: null, pt: '', notas: '', instrucao: '', ouvindo: false, ultimoModo: null };
  S.mobileDetalhe = true;
  renderLista(); renderDetalhe();
  await recarregarFicha();
  // Precisa de você e a IA automática está ligada: já abre a caixa com a sugestão
  const it = item;
  if (S.autoIA && it.urgencia != null && it.urgencia <= 5 && !it.resposta_na_fila && S.sel && S.sel.autor_id === (item.autor_id || item.conversa_id)) {
    S.comp = novoCompositor(); renderDetalhe(); sugerirIA('sugerir');
  }
}
async function recarregarFicha() {
  if (!S.sel) return;
  const alvo = S.sel.autor_id;
  const [fi, th] = await Promise.all([
    sb.rpc('ficha_cliente', { p_autor_id: alvo, p_marca: S.sel.marca || null }),
    sb.from('conversas').select('id,marca,canal,direcao,texto,categoria,mensagem_id,criado_em,autor').eq('autor_id', alvo).order('criado_em', { ascending: false }).limit(120),
  ]);
  if (!S.sel || S.sel.autor_id !== alvo) return;
  if (fi.error || th.error) S.fichaErro = (fi.error || th.error).message;
  S.ficha = fi.data || null; S.thread = (th.data || []).reverse();
  if (!S.sel.autor) S.sel.autor = S.thread.find(m => m.autor)?.autor || null;
  if (!S.sel.idioma) S.sel.idioma = (MARCA[S.sel.marca] || {}).idioma || 'es';
  renderDetalhe();
}
async function acao(fn, args, okMsg) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { toast(error.message, true); return null; }
  toast(okMsg || 'Feito');
  await Promise.all([carregar(), recarregarFicha()]);
  return data ?? true;
}
function iniciarTimers() {
  pararTimers();
  S.timer = setInterval(carregar, CONFIG.refreshSeg * 1000);
  S.tick = setInterval(() => { renderStatus(); if (S.admin) { renderLista(); if (S.sel && !S.comp && !S.reemb) renderDetalhe(); } }, 30 * 1000);
  document.addEventListener('visibilitychange', onVisivel);
}
function pararTimers() { clearInterval(S.timer); clearInterval(S.tick); document.removeEventListener('visibilitychange', onVisivel); }
function onVisivel() { if (document.visibilityState === 'visible' && S.admin && Date.now() - (S.carregadoEm || 0) > 20e3) carregar(); }

/* ---------- IA ---------- */
async function sugerirIA(modo) {
  const c = S.comp, s = S.sel; if (!c || !s) return;
  const it = s.item || {};
  if (modo === 'melhorar' && !S.ia.instrucao.trim()) { toast('Diga ou escreva o que mudar.', true); return; }
  S.ia.carregando = true; S.ia.erro = null; S.ia.ultimoModo = modo; renderDetalhe();
  const j = janelas(it.ultima_entrada, s.canal);
  const alvo = c.canal !== 'dm' ? comentariosSemResposta().find(m => m.mensagem_id === c.ref) : null;
  const body = {
    autor_id: s.autor_id, marca: s.marca, canal: c.canal, idioma: c.idioma, modo,
    rascunho: c.texto || null, instrucao: modo === 'melhorar' ? S.ia.instrucao.trim() : null,
    categorias: it.categorias || null, motivo_urgencia: it.motivo_urgencia || null, janela: janelaTexto(j),
    comentario_alvo: alvo ? (alvo.texto || '(mídia)') : null,
  };
  const { data, error } = await sb.functions.invoke('sugerir-resposta', { body });
  if (!S.comp || S.sel !== s) return;
  S.ia.carregando = false;
  if (error) {
    let msg = error.message || 'erro';
    try { const ctx = error.context; if (ctx && typeof ctx.json === 'function') { const b = await ctx.json(); if (b?.erro) msg = b.erro; } } catch {}
    S.ia.erro = msg; renderDetalhe(); return;
  }
  if (data?.erro) { S.ia.erro = data.erro; renderDetalhe(); return; }
  c.texto = data.texto || ''; c.modelo = '';
  S.ia.pt = data.texto_pt || ''; S.ia.notas = data.notas || '';
  if (modo === 'melhorar') { S.ia.instrucao = ''; toast('Reescrito. A correção ficou salva como preferência.'); }
  renderDetalhe();
}
function ditar() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Este navegador não faz ditado. Use o Chrome no celular ou escreva.', true); return; }
  if (S.ia.ouvindo && S.ia.rec) { S.ia.rec.stop(); return; }
  const rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = true;
  let base = S.ia.instrucao ? S.ia.instrucao.trim() + ' ' : '';
  rec.onresult = e => {
    let final = '', parcial = '';
    for (let i = 0; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) final += r[0].transcript + ' '; else parcial += r[0].transcript; }
    S.ia.instrucao = (base + final + parcial).trim();
    const inp = $('#iaInstr'); if (inp) inp.value = S.ia.instrucao;
  };
  rec.onend = () => { S.ia.ouvindo = false; S.ia.rec = null; const b = $('#iaMic'); if (b) b.classList.remove('on'); };
  rec.onerror = ev => { S.ia.ouvindo = false; S.ia.rec = null; renderDetalhe(); if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('Ditado: ' + ev.error, true); };
  S.ia.rec = rec; S.ia.ouvindo = true; rec.start();
  const b = $('#iaMic'); if (b) b.classList.add('on');
}

  const r = $('#btResolver'); if (r) r.onclick = async () => { if (confirm('Marcar como resolvido? Sai da lista de travados.')) await acao('marcar_estado', { p_conversa_id: s.autor_id, p_marca: s.marca, p_estado: 'resolvido', p_autor: s.autor }, 'Marcado como resolvido'); };
  const ra = $('#btReabrir'); if (ra) ra.onclick = () => acao('marcar_estado', { p_conversa_id: s.autor_id, p_marca: s.marca, p_estado: 'aguardando_gabriel', p_autor: s.autor }, 'Reaberto');
  document.querySelectorAll('[data-cancelar]').forEach(e => e.onclick = async () => { if (confirm('Cancelar esta resposta antes de sair?')) await acao('cancelar_resposta', { p_id: Number(e.dataset.cancelar) }, 'Cancelada'); });
  if (S.comp) ligarCompositor(j);
  if (S.reemb) ligarReembolso();
}

/* ---------- compositor ---------- */
function comentariosSemResposta() {
  return (S.thread || []).filter(m => m.canal === 'comentario' && m.direcao === 'entrada' && m.mensagem_id && /^[0-9]{15,20}$/.test(m.mensagem_id)).slice(-8).reverse();
}
function novoCompositor() {
  const s = S.sel, coms = comentariosSemResposta();
  const canal = s.canal === 'comentario' && coms.length ? 'comentario_publico' : 'dm';
  return { canal, ref: canal === 'dm' ? s.autor_id : coms[0].mensagem_id, idioma: ['es', 'en'].includes(s.idioma) ? s.idioma : (MARCA[s.marca] || {}).idioma || 'es', texto: '', modelo: '' };
}
function compositorHtml(j) {
  const c = S.comp, s = S.sel, coms = comentariosSemResposta();
  const ctx = ctxModelo(); ctx.idiomaModelo = c.idioma; ctx.j = j;
  const avisos = lint(c.texto, c.canal, c.texto ? ctx : null);
  const temErro = avisos.some(a => a.nivel === 'erro');
  const linhas = c.texto.split('\n').filter(l => l.trim()).length;
  const modelos = MODELOS.filter(m => m.canais.includes(c.canal));
  const ia = S.ia;
  return `<div class="block" id="comp"><h3>Responder <span class="sub muted">· entra na fila, o n8n envia em até 5 min</span></h3>
    <div class="form-grid">
      <div><label class="lbl">Por onde</label><select id="compCanal">
          <option value="dm" ${c.canal === 'dm' ? 'selected' : ''}>DM (mensagem direta)</option>
          ${coms.length ? `<option value="comentario_publico" ${c.canal === 'comentario_publico' ? 'selected' : ''}>Comentário público (3 linhas, sem link)</option><option value="comentario_privado" ${c.canal === 'comentario_privado' ? 'selected' : ''}>Resposta privada ao comentário</option>` : ''}
        </select></div>
      <div><label class="lbl">Idioma da resposta <span class="muted">(detectado: ${esc(IDIOMA_NOME[s.idioma] || s.idioma || '?')})</span></label>
        <select id="compIdioma"><option value="es" ${c.idioma === 'es' ? 'selected' : ''}>Español</option><option value="en" ${c.idioma === 'en' ? 'selected' : ''}>English</option><option value="pt" ${c.idioma === 'pt' ? 'selected' : ''}>Português</option><option value="it" ${c.idioma === 'it' ? 'selected' : ''}>Italiano</option><option value="de" ${c.idioma === 'de' ? 'selected' : ''}>Deutsch</option></select></div>
      ${c.canal !== 'dm' ? `<div style="grid-column:1/-1"><label class="lbl">Qual comentário</label><select id="compRef">${coms.map(m => `<option value="${esc(m.mensagem_id)}" ${m.mensagem_id === c.ref ? 'selected' : ''}>${fmtDataHora(m.criado_em)} · ${esc((m.texto || '(mídia)').slice(0, 90))}</option>`).join('')}</select></div>` : ''}
    </div>

    <div class="iabox">
      <div class="t">✨ IA · sugere e reescreve com a ficha, a conversa, o conhecimento da empresa e suas correções</div>
      <div class="row">
        <button id="iaSugerir" ${ia.carregando ? 'disabled' : ''}>${c.texto ? 'Sugerir de novo' : 'Sugerir resposta'}</button>
        <span class="tiny" style="opacity:.75">ou ajuste o que já está na caixa:</span>
      </div>
      <div class="row" style="margin-top:8px">
        <input id="iaInstr" class="grow" placeholder="Diga o que mudar: 'mais curta, cita a garantia, pede o e-mail'…" value="${esc(ia.instrucao)}" ${ia.carregando ? 'disabled' : ''}>
        <button id="iaMic" class="mic ${ia.ouvindo ? 'on' : ''}" title="Ditar (Chrome no celular ou PC)">🎤</button>
        <button id="iaMelhorar" ${ia.carregando || !c.texto ? 'disabled' : ''}>Melhorar</button>
      </div>
      ${ia.carregando ? `<div class="status">IA pensando… (${ia.ultimoModo === 'melhorar' ? 'reescrevendo com a sua instrução' : 'lendo ficha e conversa'})</div>` : ''}
      ${ia.erro ? `<div class="status err">${esc(ia.erro)}</div>` : ''}
      ${!ia.carregando && !ia.erro ? `<div class="status tiny" style="opacity:.6">Cada "Melhorar" fica salvo como preferência sua. Não vira regra sozinho; a IA consulta antes de escrever a próxima.</div>` : ''}
    </div>

    <div class="row" style="margin-top:8px"><label class="lbl" style="margin:0">Ou um modelo fixo:</label>
      <select id="compModelo" style="width:auto;flex:1"><option value="">— nenhum —</option>${modelos.map(m => `<option value="${m.id}" ${c.modelo === m.id ? 'selected' : ''}>${esc(m.nome)}</option>`).join('')}</select></div>
    <div style="margin-top:10px"><textarea id="compTexto" placeholder="A resposta que vai para o cliente, no idioma dele.">${esc(c.texto)}</textarea></div>
    ${ia.pt ? `<div class="ptbox"><span class="l">Em português (para você conferir)</span>${esc(ia.pt)}</div>` : ''}
    ${ia.notas ? `<div class="notas">⚠︎ IA: ${esc(ia.notas)}</div>` : ''}
    <div class="cnt"><span>${c.texto.length}/1000 caracteres</span><span>${linhas} linha(s)${c.canal === 'comentario_publico' ? ' de 3' : ''}</span>
      ${ctx.emailCompleto ? `<span class="copy" data-ins="${esc(ctx.email)}" title="inserir no texto">+ e-mail mascarado</span>` : ''}
      ${ctx.codigos.length ? `<span class="copy" data-ins="${esc(ctx.codigos.join(', '))}" title="inserir no texto">+ código(s) da transação</span>` : ''}
      ${ctx.thankyou && c.canal !== 'comentario_publico' ? `<span class="copy" data-ins="${esc(ctx.thankyou)}" title="inserir no texto">+ link thank you</span>` : ''}
    </div>
    <ul class="lint">${avisos.map(a => `<li class="${a.nivel}">${esc(a.msg)}</li>`).join('')}</ul>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="compEnviar" ${temErro || !c.texto.trim() ? 'disabled' : ''}>Pôr na fila</button>
      <button class="ghost" id="compLimpar">Limpar</button>
      <span class="tiny muted">Para ${esc(canalTxt(c.canal))} · ref <span class="mono">${esc(c.ref)}</span></span>
    </div></div>`;
}
function ligarCompositor(j) {
  const c = S.comp;
  const rerender = () => renderDetalhe();
  $('#compCanal').onchange = e => { c.canal = e.target.value; c.ref = c.canal === 'dm' ? S.sel.autor_id : (comentariosSemResposta()[0]?.mensagem_id || ''); c.modelo = ''; rerender(); };
  $('#compIdioma').onchange = e => { c.idioma = e.target.value; if (c.modelo) aplicarModelo(); rerender(); };
  const r = $('#compRef'); if (r) r.onchange = e => { c.ref = e.target.value; };
  $('#compModelo').onchange = e => { c.modelo = e.target.value; if (c.modelo) { aplicarModelo(); S.ia.pt = ''; S.ia.notas = ''; } rerender(); };
  const ta = $('#compTexto');
  let deb; ta.oninput = () => { c.texto = ta.value; clearTimeout(deb); deb = setTimeout(() => { const pos = ta.selectionStart; rerender(); const n = $('#compTexto'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 600); };
  document.querySelectorAll('#comp [data-ins]').forEach(e => e.onclick = () => { const n = $('#compTexto'); const p = n.selectionStart; c.texto = c.texto.slice(0, p) + e.dataset.ins + c.texto.slice(p); rerender(); });
  $('#compLimpar').onclick = () => { c.texto = ''; c.modelo = ''; S.ia.pt = ''; S.ia.notas = ''; rerender(); };
  $('#compEnviar').onclick = async () => {
    const btn = $('#compEnviar'); btn.disabled = true; btn.textContent = 'Pondo na fila…';
    const id = await acao('responder', { p_marca: S.sel.marca, p_canal: c.canal, p_ref: c.ref, p_texto: c.texto }, 'Na fila. Sai em até 5 min.');
    if (id) { S.comp = null; renderDetalhe(); } else { btn.disabled = false; btn.textContent = 'Pôr na fila'; }
  };
  $('#iaSugerir').onclick = () => sugerirIA('sugerir');
  $('#iaMelhorar').onclick = () => sugerirIA('melhorar');
  const inp = $('#iaInstr'); inp.oninput = () => { S.ia.instrucao = inp.value; $('#iaMelhorar').disabled = !c.texto || !inp.value.trim(); };
  inp.onkeydown = e => { if (e.key === 'Enter' && inp.value.trim() && c.texto) { e.preventDefault(); sugerirIA('melhorar'); } };
  $('#iaMic').onclick = ditar;
}
function aplicarModelo() { const c = S.comp; const m = MODELOS.find(x => x.id === c.modelo); if (!m) return; c.texto = (m[c.idioma] || m.es)(ctxModelo()); }

/* ---------- reembolso ---------- */
function reembolsoHtml() {
  const r = S.reemb, f = S.ficha || {}, pagas = (f.compras || []).filter(c => c.pago);
  return `<div class="block" id="reemb"><h3>Registrar pedido de reembolso <span class="sub muted">· política de 05/09: perguntar o motivo, salvar, mandar o passo a passo mesmo sem resposta</span></h3>
    <div class="notice warn">Quem processa é a Hotmart. Nunca prometer. Garantia: 7 dias, 100%. Depois de salvar, a resposta com o passo a passo e o código abre pronta.</div>
    <div class="form-grid">
      <div style="grid-column:1/-1"><label class="lbl">Transações (marque as do pedido)</label>
        ${pagas.length ? pagas.map(c => `<label style="display:block;font-size:13.5px;margin:2px 0"><input type="checkbox" data-tx="${esc(c.transacao)}" ${r.transacoes.includes(c.transacao) ? 'checked' : ''} style="width:auto;margin-right:6px">${esc(c.transacao)} · ${esc((c.produto_nome || '').replace(/&amp;/g, '&')).slice(0, 60)} · ${fmtValor(c.valor, c.moeda)}</label>`).join('') : '<div class="muted small">Nenhuma compra paga achada. Registre mesmo assim.</div>'}</div>
      <div><label class="lbl">Origem do motivo</label><select id="reOrigem"><option value="perguntado" ${r.origem === 'perguntado' ? 'selected' : ''}>perguntado (respondeu quando perguntei)</option><option value="espontaneo" ${r.origem === 'espontaneo' ? 'selected' : ''}>espontâneo (já tinha dito)</option><option value="sem_resposta" ${r.origem === 'sem_resposta' ? 'selected' : ''}>sem resposta (mando o passo a passo assim mesmo)</option></select></div>
      <div><label class="lbl">Já vou mandar o passo a passo?</label><select id="reOrientado"><option value="1" ${r.orientado ? 'selected' : ''}>sim, agora</option><option value="0" ${!r.orientado ? 'selected' : ''}>ainda não</option></select></div>
      <div style="grid-column:1/-1"><label class="lbl">Motivo, nas palavras da pessoa</label><textarea id="reMotivo" style="min-height:70px">${esc(r.motivo)}</textarea></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="primary" id="reSalvar">Salvar e abrir a resposta</button><button class="ghost" id="reFechar">Cancelar</button></div></div>`;
}
function ligarReembolso() {
  const r = S.reemb, s = S.sel, f = S.ficha || {};
  document.querySelectorAll('#reemb [data-tx]').forEach(cb => cb.onchange = () => { r.transacoes = [...document.querySelectorAll('#reemb [data-tx]:checked')].map(x => x.dataset.tx); });
  $('#reOrigem').onchange = e => r.origem = e.target.value;
  $('#reOrientado').onchange = e => r.orientado = e.target.value === '1';
  $('#reMotivo').oninput = e => r.motivo = e.target.value;
  $('#reFechar').onclick = () => { S.reemb = null; renderDetalhe(); };
  $('#reSalvar').onclick = async () => {
    const pagas = (f.compras || []).filter(c => r.transacoes.includes(c.transacao));
    const total = pagas.reduce((a, c) => a + Number(c.valor || 0), 0);
    const ctx = ctxModelo();
    const id = await acao('registrar_reembolso', { p_marca: s.marca, p_canal: s.canal === 'comentario' ? 'comentario' : 'dm', p_autor: s.autor, p_autor_id: s.autor_id,
      p_email: ctx.emailCompleto || null, p_transacoes: r.transacoes, p_valor_total: pagas.length ? total : null, p_moeda: pagas[0]?.moeda || null,
      p_motivo: r.motivo, p_motivo_origem: r.origem, p_orientado: r.orientado, p_observacao: null }, 'Reembolso registrado');
    if (id) { S.reemb = null; if (r.orientado) { S.comp = novoCompositor(); S.comp.canal = 'dm'; S.comp.ref = s.autor_id; S.comp.modelo = 'reembolso'; aplicarModelo(); } renderDetalhe(); }
  };
}

/* ---------- conhecimento da IA ---------- */
async function abrirConhecimento() {
  S.modal = { novoTema: 'entrega', novoTexto: '', carregando: true };
  renderModal();
  const { data, error } = await sb.from('ia_conhecimento').select('id,tema,texto,atualizado_em,atualizado_por').eq('ativo', true).order('tema').order('id');
  S.modal.carregando = false; S.conhecimento = error ? [] : data; if (error) toast(error.message, true);
  renderModal();
}
function renderModal() {
  const el = $('#modal'); if (!S.modal) { el.innerHTML = ''; return; }
  const m = S.modal, lista = S.conhecimento || [];
  const temas = ['entrega', 'produto', 'pagamento', 'reembolso', 'empresa', 'canais', 'problemas conhecidos', 'geral'];
  el.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal">
    <div class="row"><h2 class="grow">O que a IA sabe sobre a empresa</h2><button class="small" id="mFechar">Fechar</button></div>
    <div class="small muted" style="margin-bottom:10px">Fatos, não regras de escrita (as regras estão fixas no prompt). Tudo aqui entra em toda sugestão. Escreva como explicaria para um funcionário novo.</div>
    <div class="block" style="margin:8px 0"><div class="form-grid">
      <div><label class="lbl">Tema</label><select id="mTema">${temas.map(t => `<option ${m.novoTema === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div style="grid-column:1/-1"><label class="lbl">Fato novo</label><textarea id="mTexto" style="min-height:70px" placeholder="Ex.: Quando a pessoa manda o e-mail e a compra é válida, mandamos o link da thank you e reenviamos o e-mail com os arquivos.">${esc(m.novoTexto)}</textarea></div>
    </div><div class="row" style="margin-top:8px"><button class="primary" id="mSalvar">Adicionar</button></div></div>
    ${m.carregando ? '<div class="notice">Carregando…</div>' : lista.map(k => `<div class="fato"><span class="tema">${esc(k.tema)}</span><span class="tx">${esc(k.texto)}</span><button class="small danger" data-del="${k.id}" title="remover">×</button></div>`).join('')}
  </div></div>`;
  $('#mFechar').onclick = () => { S.modal = null; renderModal(); };
  $('#mbg').onclick = e => { if (e.target.id === 'mbg') { S.modal = null; renderModal(); } };
  $('#mTema').onchange = e => m.novoTema = e.target.value;
  $('#mTexto').oninput = e => m.novoTexto = e.target.value;
  $('#mSalvar').onclick = async () => {
    if (!m.novoTexto.trim()) return toast('Escreva o fato.', true);
    const { error } = await sb.rpc('salvar_conhecimento', { p_id: null, p_tema: m.novoTema, p_texto: m.novoTexto });
    if (error) return toast(error.message, true);
    toast('Adicionado. Vale a partir da próxima sugestão.'); m.novoTexto = ''; abrirConhecimento();
  };
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('Remover este fato do conhecimento da IA?')) return; const { error } = await sb.rpc('apagar_conhecimento', { p_id: Number(b.dataset.del) }); if (error) return toast(error.message, true); abrirConhecimento(); });
}

/* ---------- conversa ---------- */
function threadHtml() {
  const msgs = (S.thread || []).map(m => ({ t: m.criado_em, dir: m.direcao, texto: m.texto, canal: m.canal, cat: m.categoria }));
  (S.ficha?.fila || []).forEach(fr => msgs.push({ t: fr.enviado_em || fr.criado_em, dir: 'saida', texto: fr.texto, canal: fr.canal, fila: fr }));
  msgs.sort((a, b) => new Date(a.t) - new Date(b.t));
  let dia = '', h = '';
  for (const m of msgs) {
    const d = fmtDataLonga(m.t); if (d !== dia) { dia = d; h += `<div class="day">${esc(d)}</div>`; }
    const vazio = !m.texto || !String(m.texto).trim();
    const cls = m.dir === 'entrada' ? 'in' : 'out';
    const extra = m.fila ? (m.fila.enviado_em ? 'fila' : 'pend') : '';
    let meta = `${fmtHora(m.t)} · ${canalTxt(m.canal)}${m.cat ? ' · ' + esc(m.cat) : ''}`;
    if (m.fila) meta += ` · fila #${esc(m.fila.id)}${m.fila.origem ? ' · ' + esc(m.fila.origem) : ''}` + (m.fila.enviado_em ? ` · enviada${m.fila.resultado && m.fila.resultado !== 'ok' ? ' · <b style="color:var(--danger)">FALHOU: ' + esc(m.fila.resultado) + '</b>' : ''}` : ` · <b>ainda não enviada</b> <button class="small danger" data-cancelar="${esc(m.fila.id)}">cancelar</button>`);
    if (vazio && m.dir === 'entrada') h += `<div class="msg in midia">📎 Mídia sem texto (imagem, print ou áudio). Só dá para ver no Instagram.<span class="m">${meta}</span></div>`;
    else h += `<div class="msg ${cls} ${extra}">${esc(m.texto)}<span class="m">${meta}</span></div>`;
  }
  return h || `<div class="muted small">Nenhuma mensagem gravada.</div>`;
}

iniciar();
</script>
</body>
</html>
