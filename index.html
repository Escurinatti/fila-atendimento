<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111219" media="(prefers-color-scheme: dark)">
<title>Fila — Atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* Tema: roda antes do CSS pintar, para não piscar. Guardado em fila.tema; sem escolha, segue o sistema. */
  function aplicarTema(t) {
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('fila.tema', t); } catch {}
    const m = document.querySelector('meta[name="theme-color"]:not([media])'); if (m) m.content = t === 'dark' ? '#111219' : '#f7f5f0';
  }
  (function () {
    let t = null; try { t = localStorage.getItem('fila.tema'); } catch {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* ===================================================================
     Tema — tudo em variável. Claro é o padrão; [data-theme="dark"] troca
     só os tokens. Nenhum seletor mudou de nome: o JavaScript não sabe disso.
     Cor da casa: o dourado da estrela ✦ do Mapa del Tarot.
     =================================================================== */
  :root{
    --bg:#f6f4ef; --bg2:#eeebe4; --card:#ffffff; --ink:#1b1c21; --muted:#6a6f7d; --line:#e6e2d9;
    --accent:#c8811f; --accent-ink:#8f5a10; --accent-soft:#fbf1e2; --soft:#f3f1ec; --soft2:#e9e6df;
    --ok:#1f8a5b; --ok-soft:#e8f6ee; --warn:#b8780a; --warn-soft:#fff6e3; --danger:#d1413f; --danger-soft:#fdeeee;
    --u1:#d1413f; --u2:#e8801e; --u3:#c8811f; --u4:#8a7fb3; --u5:#8f96a6; --u7:#c3c7cf; --u8:#1f8a5b; --u9:#c3c7cf;
    --out:#fbf1e2; --out-ink:#4a3410;
    --mdt:#fbf1e2; --mdt-ink:#8f5a10; --cm:#e6f4ee; --cm-ink:#166b45; --it:#efe9fb; --it-ink:#5c3d9e;
    --ia:#1b1c21; --ia-ink:#f5f2ea; --ia-in:#2a2c35; --ia-line:#3a3d4a;
    --com:#7c5cbf; --com-ink:#5c3d9e; --com-soft:#f1ecfa;
    --header:rgba(246,244,239,.86);
    --shadow:0 1px 2px rgba(20,20,30,.04), 0 8px 24px rgba(20,20,30,.06);
    --shadow-lg:0 14px 40px rgba(20,20,30,.16);
    --r:16px; --r-sm:10px;
  }
  :root[data-theme="dark"]{
    --bg:#111219; --bg2:#0c0d13; --card:#1a1c26; --ink:#eceef5; --muted:#98a0b3; --line:#2a2e3c;
    --accent:#e0a54a; --accent-ink:#f0c884; --accent-soft:#2c2618; --soft:#20232f; --soft2:#2a2e3d;
    --ok:#4cc38a; --ok-soft:#15281f; --warn:#e0b84a; --warn-soft:#2b2411; --danger:#f07070; --danger-soft:#2c1a1a;
    --u1:#f07070; --u2:#f5a054; --u3:#e0a54a; --u4:#a89cd6; --u5:#8b93a7; --u7:#4a5062; --u8:#4cc38a; --u9:#4a5062;
    --out:#2c2618; --out-ink:#f5e6c8;
    --mdt:#2c2618; --mdt-ink:#f0c884; --cm:#15281f; --cm-ink:#8fdbb5; --it:#251d3a; --it-ink:#c9b5f2;
    --ia:#0c0d13; --ia-ink:#eceef5; --ia-in:#1a1c26; --ia-line:#2a2e3c;
    --com:#a88be6; --com-ink:#c9b5f2; --com-soft:#241d36;
    --header:rgba(17,18,25,.84);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.40);
    --shadow-lg:0 18px 50px rgba(0,0,0,.6);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
  a{color:var(--accent-ink)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);padding:7px 13px;transition:.15s;font-weight:500}
  button:hover{border-color:var(--accent);color:var(--accent-ink)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(200,129,31,.25)}
  button.primary:hover{filter:brightness(1.06);color:#fff}
  button.ghost{background:transparent}
  button.small{padding:4px 10px;font-size:13px}
  button.danger{color:var(--danger)} button.danger:hover{border-color:var(--danger)}
  button.ok{color:var(--ok)} button.ok:hover{border-color:var(--ok)}
  button.ia{background:var(--ia);border-color:var(--ia);color:var(--ia-ink);font-weight:600}
  button.ia:hover{filter:brightness(1.15);color:var(--ia-ink)}
  button.tema{font-size:15px;padding:4px 9px}
  button:disabled{opacity:.45;cursor:not-allowed}
  input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:9px 11px;width:100%}
  textarea{min-height:120px;resize:vertical;line-height:1.45}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .ico{width:1.05em;height:1.05em;display:inline-block;vertical-align:-.2em;flex:none}
  .ico.flag{width:1.3em;height:.9em;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.14);vertical-align:-.12em}
  h3 .ico,.tab .ico{width:1.15em;height:1.15em}
  .msg .ch .ico{width:1.2em;height:1.2em;vertical-align:-.3em;margin-right:1px}
  .muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .hide{display:none!important}
  ::selection{background:var(--accent-soft);color:var(--ink)}
  ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--soft2);border-radius:99px;border:2px solid var(--bg)} ::-webkit-scrollbar-thumb:hover{background:var(--u5)}

  /* ---------- login ---------- */
  .login{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 600px at 20% -10%,var(--accent-soft),transparent 60%),var(--bg)}
  .login .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:var(--shadow-lg)}
  .login h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
  .login label{display:block;margin:14px 0 5px;font-size:13px;color:var(--muted)}
  .login .msg{margin-top:12px;font-size:13.5px;padding:10px 12px;border-radius:var(--r-sm);background:var(--soft)}
  .login .msg.err{color:var(--danger)} .login .msg.ok{color:var(--ok)}
  .login .links{margin-top:14px;display:flex;justify-content:space-between;gap:10px;font-size:13px}
  .login .links a{cursor:pointer}
  .logo{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#e9b45c);color:#fff;font-weight:800;font-size:16px;vertical-align:-8px;margin-right:8px;box-shadow:0 4px 12px rgba(200,129,31,.35)}

  /* ---------- cabeçalho ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--header);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px 8px}
  .hrow h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center}
  .pill{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--card)}
  .pill.live{color:var(--ok);border-color:currentColor} .pill.stale{color:var(--warn);border-color:currentColor} .pill.err{color:var(--danger);border-color:currentColor}
  .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .filters select{width:auto;padding:5px 8px;font-size:13px;border-radius:9px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--card);padding:2px;gap:2px}
  .seg button{border:0;border-radius:8px;padding:4px 11px;font-size:13px;background:transparent}
  .seg button:hover{background:var(--soft);color:var(--ink)}
  .seg button.on{background:var(--ink);color:var(--bg)}
  :root[data-theme="dark"] .seg button.on{background:var(--accent);color:#1b1206}
  .tabs{display:flex;gap:6px;padding:0 18px 10px;overflow-x:auto;scrollbar-width:none} .tabs::-webkit-scrollbar{display:none}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;font-size:13.5px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;font-weight:500}
  .tab:hover{border-color:var(--accent);color:var(--ink)}
  .tab .n{background:var(--soft2);border-radius:999px;padding:0 7px;font-size:12px;font-weight:600;color:var(--ink)}
  .tab .n.red{background:var(--danger);color:#fff}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#1b1206;font-weight:600;box-shadow:0 4px 14px rgba(200,129,31,.25)}
  .tab.on .n{background:rgba(0,0,0,.14);color:#1b1206} .tab.on .n.red{background:#fff;color:var(--danger)}

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(340px,440px) 1fr;min-height:calc(100vh - 96px)}
  .list{border-right:1px solid var(--line);padding:12px 12px 40px;overflow-y:auto;max-height:calc(100vh - 96px);background:var(--bg2)}
  .detail{padding:16px 24px 90px;overflow-y:auto;max-height:calc(100vh - 96px)}
  .detail .empty{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:40px}
  .grp{display:flex;align-items:center;gap:8px;margin:14px 4px 8px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .grp .n{background:var(--soft2);border-radius:999px;padding:1px 8px;color:var(--ink);letter-spacing:0}
  .grp.red{color:var(--danger)} .grp.red .n{background:var(--danger);color:#fff}
  .grp.blue{color:var(--accent-ink)}
  details.baixo summary{cursor:pointer;list-style:none} details.baixo summary::-webkit-details-marker{display:none}
  details.baixo summary .grp{margin-bottom:4px} details.baixo summary .grp::after{content:"▸";margin-left:auto} details.baixo[open] summary .grp::after{content:"▾"}

  /* ---------- card da lista ---------- */
  .card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 18px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
  .card.sel{outline:2px solid var(--accent);outline-offset:-1px}
  .card.red{border-color:color-mix(in srgb,var(--danger) 35%,var(--line));background:var(--danger-soft)}
  .card::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--ub)}
  .card .who{font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card .espera{margin-left:auto;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
  .card .espera .esp{font-style:normal;font-weight:500;font-size:11.5px;opacity:.7}
  .card.red .espera{color:var(--danger)}
  .card .motivo{font-size:12.5px;font-weight:600;color:var(--ub);margin-top:2px}
  .card .txt{margin:6px 0;font-size:14px;color:var(--ink);opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
  .card.dim{opacity:.6}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
  .chip.lang{display:inline-flex;align-items:center;gap:5px}
  .chip.mdt{background:var(--mdt);color:var(--mdt-ink)} .chip.cm{background:var(--cm);color:var(--cm-ink)} .chip.it{background:var(--it);color:var(--it-ink)}
  .chip.lang{background:var(--ink);color:var(--bg);font-weight:600;letter-spacing:.02em}
  :root[data-theme="dark"] .chip.lang{background:var(--soft2);color:var(--ink)}
  .chip.midia{background:var(--danger);color:#fff;font-weight:600}
  .chip.fila{background:var(--ok);color:#fff}
  .chip.pausa{border:1px dashed var(--warn);background:transparent;color:var(--warn)}
  .chip.mail{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
  .chip.compra{background:var(--ok);color:#fff}
  .janelas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .jan{font-size:12px;color:var(--muted)} .jan b{color:var(--ink);font-weight:600}
  .bar{height:4px;background:var(--soft2);border-radius:2px;margin-top:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:2px}
  .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--danger)}
  .jan.closed b{color:var(--danger)}
  .trav{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card);margin-bottom:6px;cursor:pointer;font-size:13.5px}
  .trav:hover{border-color:var(--accent)} .trav.sel{outline:2px solid var(--accent);outline-offset:-1px}
  .trav .d{margin-left:auto;font-weight:600;white-space:nowrap}

  /* ---------- detalhe ---------- */
  .dhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .dhead h2{margin:0;font-size:21px;letter-spacing:-.02em}
  .back{display:none}
  .block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0;box-shadow:var(--shadow)}
  .block h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .block h3 .sub{letter-spacing:0;text-transform:none;font-weight:500}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px} .kv .k{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;padding:4px 8px 6px;border-bottom:1px solid var(--line)}
  td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0}
  .st{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--soft);white-space:nowrap}
  .st.pago{background:var(--ok);color:#fff} .st.neg{background:var(--danger);color:#fff}
  .tablewrap{overflow-x:auto}

  /* ---------- conversa ---------- */
  .thread{display:flex;flex-direction:column;gap:6px;max-height:520px;overflow-y:auto;padding-right:4px}
  .msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;word-break:break-word;line-height:1.45}
  .msg.in{align-self:flex-start;background:var(--soft);border-bottom-left-radius:5px}
  .msg.out{align-self:flex-end;background:var(--out);color:var(--out-ink);border-bottom-right-radius:5px}
  .msg .m{display:block;font-size:11px;opacity:.6;margin-top:4px}
  /* tradução para PT do que o cliente escreveu: abaixo do original, separada por um fio */
  .msg .pt{display:block;margin-top:7px;padding-top:6px;border-top:1px dashed color-mix(in srgb,var(--ink) 22%,transparent);font-size:13px;color:var(--ink);opacity:.85}
  .card .txt.pt{margin-top:3px;color:var(--ink);opacity:.8;font-size:12.5px;padding-left:8px;border-left:2px solid var(--accent)}
  .msg.midia{border:1px dashed var(--danger);background:var(--danger-soft);color:var(--danger);font-weight:600}
  .msg.apagada{opacity:.55;text-decoration:line-through;border:1px dashed var(--danger)}
  .msg .apagar{display:inline-block;margin-left:8px;padding:1px 9px;font-size:11.5px;font-weight:600;border:1px solid var(--danger);background:var(--card);color:var(--danger);border-radius:8px;cursor:pointer;opacity:1}
  .msg .apagar:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
  .msg.fila{border:1px solid var(--ok)} .msg.pend{border:1px dashed var(--ok);background:var(--ok-soft)}
  .day{align-self:center;font-size:11.5px;color:var(--muted);margin:8px 0 2px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px}
  .notice{font-size:13px;padding:10px 12px;border-radius:var(--r-sm);background:var(--soft);margin:8px 0}
  .notice.warn{color:var(--warn);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
  .notice.bad{color:var(--danger);background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
  .notice.ok{color:var(--ok);background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
  .acoes{display:flex;gap:8px;flex-wrap:wrap}
  .lint{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
  .lint li{padding:4px 0 4px 22px;position:relative}
  .lint li::before{content:"";position:absolute;left:4px;top:9px;width:10px;height:10px;border-radius:50%}
  .lint li.erro{color:var(--danger)} .lint li.erro::before{background:var(--danger)}
  .lint li.aviso{color:var(--warn)} .lint li.aviso::before{background:var(--warn)}
  .lint li.ok{color:var(--ok)} .lint li.ok::before{background:var(--ok)}
  .cnt{font-size:12px;color:var(--muted);display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form-grid label,.lbl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .copy{cursor:pointer;border-bottom:1px dotted var(--muted)} .copy:hover{color:var(--accent-ink)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ia);color:var(--ia-ink);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow-lg);z-index:50;max-width:92vw}
  .toast.err{background:var(--danger);color:#fff}

  /* ---------- IA ---------- */
  .iabox{background:var(--ia);color:var(--ia-ink);border-radius:14px;padding:12px 14px;margin:10px 0;border:1px solid var(--ia-line)}
  .iabox .t{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7;font-weight:700;margin-bottom:8px}
  .iabox .row input{background:var(--ia-in);border-color:var(--ia-line);color:var(--ia-ink)}
  .iabox .row input::placeholder{color:var(--muted)}
  .iabox button{background:var(--accent);color:#1b1206;border-color:var(--accent);font-weight:600}
  .iabox button.ghost{background:transparent;color:var(--ia-ink);border-color:var(--ia-line)}
  .iabox button.mic{width:42px;padding:7px 0;font-size:17px}
  .iabox button.mic.on{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .iabox .status{font-size:13px;margin-top:8px;opacity:.85}
  .iabox .status.err{color:#ffb4b4}
  .ptbox{background:var(--soft);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;margin-top:8px;white-space:pre-wrap}
  .ptbox .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
  .notas{font-size:12.5px;color:var(--warn);margin-top:6px}

  /* ---------- inbox × comentários ---------- */
  .conv2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
  .conv2 .block{margin:0}
  .conv h3 .n{display:inline-block;background:var(--soft2);color:var(--ink);border-radius:999px;padding:0 7px;font-size:11px;letter-spacing:0;margin-left:2px}
  .conv-dm{border-top:3px solid var(--accent)}
  .conv-com{border-top:3px solid var(--com)}
  .conv-tudo{border-top:3px solid var(--u5)}
  .conv .thread{max-height:440px}
  .conv-tudo .thread{max-height:560px}
  .msg.com.in{background:var(--com-soft);border-left:3px solid var(--com)}
  .msg.com.out{border-right:3px solid var(--com)}

/* ---------- verificador de regras ---------- */
function lint(texto, canal, ctx) {
  const out = []; const t = texto || '';
  const linhas = t.split('\n').filter(l => l.trim() !== '').length;
  const push = (nivel, msg) => out.push({ nivel, msg });
  if (!t.trim()) { push('erro', 'Texto vazio.'); return out; }
  if (t.length > 1000) push('erro', `${t.length} caracteres. O Instagram aceita até 1000.`);
  if (/mapadeltarot\.online/i.test(t)) push('erro', 'Contém mapadeltarot.online, o domínio do vazamento. O certo é mapadeltaro.online (sem "t").');
  if (canal === 'comentario_publico' || canal === 'fb_comentario_publico') {
    if (linhas > 3) push('erro', `Comentário público com ${linhas} linhas. Máximo 3.`);
    if (/(https?:\/\/|www\.|\.(com|online|net|org|io)\b)/i.test(t)) push('erro', 'Comentário público com link ou domínio. Link só em privado.');
  }
  if (/\b(vos|contame|decime|podés|tenés|querés|acá|andá|ingresá|fijate|mirá|sabés|escribime|avisame)\b/i.test(t)) push('aviso', 'Forma "vos" (rioplatense). A marca fala "tú": cuéntame, dime, puedes, tienes, aquí.');
  if (/\b160\b/.test(t)) push('aviso', 'São 163 páginas, não 160.');
  if (/oxxo/i.test(t)) push('aviso', 'Não citar OXXO: não existe no checkout.');
  if (/(voy a procesar|proceso (el|los|tu) reembolso|te reembols|reembolso (aprobado|hecho|listo)|i('ll| will) (process|issue|send) (the |your )?refund|refund (is )?(done|processed|approved)|already refunded)/i.test(t)) push('aviso', 'Promessa de reembolso. Quem processa é a Hotmart: mande o passo a passo com o código.');
  if (/\b(chile|méxico|mexico|argentina|brasil|brazil|colombia|españa|spain|somos de|we are (from|based))\b/i.test(t)) push('aviso', 'Nunca dizer de que país a marca é, nem concordar com o país sugerido.');
  if (/(biblioteca|library|mapadeltarot\.com|magic link|enlace mágico|link mágico)/i.test(t)) push('aviso', 'Entrega é por e-mail com os arquivos, nunca a biblioteca. Se precisar de página, é a thank you.');
  if (/(te escrib(o|imos) (por privado|al correo|a tu correo)|alguien del equipo|someone (from|on) (the|our) team|i('ll| will) (email|message|write) you)/i.test(t)) push('aviso', 'Promessa de contato. Faça o envio agora, antes ou junto com esta resposta.');
  const emojis = (t.match(/\p{Extended_Pictographic}/gu) || []).length;
  if (emojis > 2) push('aviso', `${emojis} emojis. Máximo 2.`);
  if (ehDireta(canal) && linhas > 8) push('aviso', `${linhas} linhas em DM. Teto sugerido: 8.`);
  if (ctx && ctx.idiomaDetectado && ctx.idiomaModelo && ctx.idiomaDetectado !== ctx.idiomaModelo) push('aviso', `A pessoa escreve em ${IDIOMA_NOME[ctx.idiomaDetectado] || ctx.idiomaDetectado} e o modelo é em ${IDIOMA_NOME[ctx.idiomaModelo] || ctx.idiomaModelo}.`);
  if (ehDireta(canal) && ctx && ctx.j && ctx.j.h24 <= 0) push('aviso', ctx.j.h7d > 0 ? 'Fora das 24h: o envio só passa com a tag human_agent. Se o despachante do n8n ainda não usa a tag, vai falhar. Alternativa: e-mail.' : 'Fora das 24h e dos 7 dias: o Instagram não vai aceitar. Use e-mail e marque "Respondi por fora".');
  if (canal === 'comentario_privado') push('aviso', 'Resposta privada a comentário: vale 7 dias e o Instagram aceita só uma por comentário.');
  if (canal === 'fb_comentario_privado') push('aviso', 'Resposta privada no Facebook: vale 7 dias e uma por comentário.');
  if (!out.length) push('ok', 'Nenhuma regra ferida.');
  return out;
}

/* ---------- auth ---------- */
async function iniciar() {
  sb.auth.onAuthStateChange(async (evento, sessao) => {
    if (evento === 'PASSWORD_RECOVERY') { S.sessao = sessao; renderNovaSenha(); return; }
    if (evento === 'SIGNED_OUT') { S.sessao = null; S.admin = false; pararTimers(); renderLogin(); return; }
    if (sessao && !S.sessao) { S.sessao = sessao; await entrar(); }
  });
  const { data } = await sb.auth.getSession();
  if (location.hash.includes('type=recovery')) return;
  if (data.session) { S.sessao = data.session; await entrar(); } else renderLogin();
}
async function entrar() {
  const { data, error } = await sb.rpc('eh_admin');
  if (error) { renderLogin(`Não consegui verificar o acesso: ${error.message}`); return; }
  if (!data) { renderSemAcesso(); return; }

}

async function carregar() {
  const [f, t] = await Promise.all([sb.rpc('fila_atendimento', { p_dias: S.dias, p_incluir_bot: S.verBot, p_tudo: S.visao === 'tudo' }), sb.rpc('atendimento_travados')]);
  if (f.error || t.error) { S.erro = (f.error || t.error).message; renderStatus(); return; }
  S.erro = null; S.fila = f.data || []; S.travados = t.data || [];
  const agora = S.fila[0]?.agora || S.travados[0]?.agora;
  S.agoraMs = agora ? new Date(agora).getTime() : Date.now();
  S.agoraLocalAt = Date.now(); S.carregadoEm = Date.now();
  if (S.sel) { const novo = S.fila.find(x => x.autor_id === S.sel.autor_id && x.marca === S.sel.marca && x.canal === S.sel.canal); if (novo) S.sel.item = novo; }
  renderTabs(); renderLista(); renderStatus();
  if (S.sel && !S.comp) renderDetalhe();
  traduzirCards();
}

/* ---------- tradução para PT (do que o CLIENTE escreveu) ----------
   Regra: quem escreve em idioma que o Gabriel não lê (tudo fora de ES/EN/PT)
   ganha a versão em português sozinho, na lista e na conversa. Para ES/EN há o
   botão 🇧🇷 na conversa. Cada mensagem é traduzida UMA vez: a função de borda
   "traduzir" grava em conversas.texto_pt e a tela só lê de lá depois. */
const cacheTrad = new Map();          // conversas.id -> pt (sessão)
let traduzindoIds = new Set();
async function traduzirIds(ids) {
  ids = [...new Set(ids)].filter(id => id && !cacheTrad.has(id) && !traduzindoIds.has(id)).slice(0, 40);
  if (!ids.length) return {};
  ids.forEach(id => traduzindoIds.add(id));
  try {
    const r = await chamarFn('traduzir', { ids });
    if (r.erro) { console.warn('traduzir:', r.erro); return {}; }
    const t = r.traducoes || {};
    Object.entries(t).forEach(([id, pt]) => cacheTrad.set(Number(id), pt));
    return t;
  } finally { ids.forEach(id => traduzindoIds.delete(id)); }
}
// Lista: acha o id da última mensagem de cada card que precisa de PT, pega o que já existe
// no banco, manda traduzir só o que falta, e repinta.
async function traduzirCards() {
  const alvo = S.fila.filter(it => it.ultima_mensagem_id && it.ultimo_texto && it.ultimo_texto.trim() && !it.ultimo_texto_pt && !LE_SEM_TRADUZIR.includes(it.idioma));
  if (!alvo.length) return;
  const { data, error } = await sb.from('conversas').select('id,mensagem_id,texto_pt').in('mensagem_id', alvo.map(it => it.ultima_mensagem_id)).eq('direcao', 'entrada');
  if (error) { console.warn('traduzirCards:', error.message); return; }
  const porMsg = new Map((data || []).map(r => [r.mensagem_id, r]));
  const faltam = [];
  alvo.forEach(it => { const r = porMsg.get(it.ultima_mensagem_id); if (!r) return; if (r.texto_pt) it.ultimo_texto_pt = r.texto_pt; else { it.traduzindo = true; faltam.push({ it, id: r.id }); } });
  renderLista();
  if (!faltam.length) return;
  const t = await traduzirIds(faltam.map(f => f.id));
  faltam.forEach(f => { f.it.traduzindo = false; if (t[f.id]) f.it.ultimo_texto_pt = t[f.id]; });
  renderLista();
}
// Conversa: traduz as entradas sem texto_pt (automático fora de ES/EN/PT; manual pelo botão 🇧🇷)
async function traduzirConversa(forcar) {
  if (!S.thread || !S.sel) return;
  if (!forcar && LE_SEM_TRADUZIR.includes(S.sel.idioma)) return;
  const alvo = S.thread.filter(m => m.direcao === 'entrada' && m.texto && m.texto.trim() && !m.texto_pt).slice(-30);
  if (!alvo.length) return;
  const quem = S.sel.autor_id;
  S.traduzindoConversa = true; renderDetalhe();
  const t = await traduzirIds(alvo.map(m => m.id));
  S.traduzindoConversa = false;
  if (!S.sel || S.sel.autor_id !== quem) return;
  S.thread.forEach(m => { if (t[m.id]) m.texto_pt = t[m.id]; });
  renderDetalhe();
}
async function abrir(item) {
  S.sel = { autor_id: item.autor_id || item.conversa_id, marca: item.marca, autor: item.autor, canal: item.canal || 'dm', idioma: item.idioma, item };
  S.ficha = null; S.thread = null; S.fichaErro = null; S.comp = null; S.reemb = null; S.env = null;
  S.ia = { carregando: false, erro: null, pt: '', notas: '', instrucao: '', ouvindo: false, ultimoModo: null };
  S.mobileDetalhe = true;
  renderLista(); renderDetalhe();
  await recarregarFicha();
  // Precisa de você e a IA automática está ligada: já abre a caixa com a sugestão
  const it = item;
  if (S.autoIA && S.visao !== 'tudo' && it.urgencia != null && it.urgencia <= 5 && !it.resposta_na_fila && S.sel && S.sel.autor_id === (item.autor_id || item.conversa_id)) {
    S.comp = novoCompositor(); renderDetalhe(); sugerirIA('sugerir');
  }
}
async function recarregarFicha() {
  if (!S.sel) return;
  const alvo = S.sel.autor_id;
  const [fi, th] = await Promise.all([
    sb.rpc('ficha_cliente', { p_autor_id: alvo, p_marca: S.sel.marca || null }),
    sb.from('conversas').select('id,marca,canal,direcao,texto,texto_pt,categoria,mensagem_id,criado_em,autor,apagado_em').eq('autor_id', alvo).order('criado_em', { ascending: false }).limit(120),
  ]);
  if (!S.sel || S.sel.autor_id !== alvo) return;
  if (fi.error || th.error) S.fichaErro = (fi.error || th.error).message;
  S.ficha = fi.data || null; S.thread = (th.data || []).reverse();
  if (!S.sel.autor) S.sel.autor = S.thread.find(m => m.autor)?.autor || null;
  if (!S.sel.idioma) S.sel.idioma = (MARCA[S.sel.marca] || {}).idioma || 'es';
  renderDetalhe();
  traduzirConversa(false);
}
async function acao(fn, args, okMsg) {
  const { data, error } = await sb.rpc(fn, args);
  if (error) { toast(error.message, true); return null; }
  toast(okMsg || 'Feito');
  await Promise.all([carregar(), recarregarFicha()]);
  return data ?? true;
}
function iniciarTimers() {
  pararTimers();
  S.timer = setInterval(carregar, CONFIG.refreshSeg * 1000);
  S.tick = setInterval(() => { renderStatus(); if (S.admin) { renderLista(); if (S.sel && !S.comp && !S.reemb) renderDetalhe(); } }, 30 * 1000);
  document.addEventListener('visibilitychange', onVisivel);
}
function pararTimers() { clearInterval(S.timer); clearInterval(S.tick); document.removeEventListener('visibilitychange', onVisivel); }
function onVisivel() { if (document.visibilityState === 'visible' && S.admin && Date.now() - (S.carregadoEm || 0) > 20e3) carregar(); }

/* ---------- IA ---------- */
async function sugerirIA(modo) {
  const c = S.comp, s = S.sel; if (!c || !s) return;
  const it = s.item || {};
  if (modo === 'melhorar' && !S.ia.instrucao.trim()) { toast('Diga ou escreva o que mudar.', true); return; }
  S.ia.carregando = true; S.ia.erro = null; S.ia.ultimoModo = modo; renderDetalhe();
  const j = janelas(it.ultima_entrada, s.canal);
  const alvo = c.canal !== 'dm' ? comentariosSemResposta().find(m => m.mensagem_id === c.ref) : null;
  const body = {
    autor_id: s.autor_id, marca: s.marca, canal: c.canal, idioma: c.idioma, modo,
    rascunho: c.texto || null, instrucao: modo === 'melhorar' ? S.ia.instrucao.trim() : null,
    categorias: it.categorias || null, motivo_urgencia: it.motivo_urgencia || null, janela: janelaTexto(j),
    comentario_alvo: alvo ? (alvo.texto || '(mídia)') : null,
  };
  const { data, error } = await sb.functions.invoke('sugerir-resposta', { body });
  if (!S.comp || S.sel !== s) return;
  S.ia.carregando = false;
  if (error) {
    let msg = error.message || 'erro';
    try { const ctx = error.context; if (ctx && typeof ctx.json === 'function') { const b = await ctx.json(); if (b?.erro) msg = b.erro; } } catch {}
    S.ia.erro = msg; renderDetalhe(); return;
  }
  if (data?.erro) { S.ia.erro = data.erro; renderDetalhe(); return; }
  c.texto = data.texto || ''; c.modelo = '';
  S.ia.pt = data.texto_pt || ''; S.ia.notas = data.notas || '';
  if (modo === 'melhorar') { S.ia.instrucao = ''; toast('Reescrito. A correção ficou salva como preferência.'); }
  renderDetalhe();
}
function ditar() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Este navegador não faz ditado. Use o Chrome no celular ou escreva.', true); return; }
  if (S.ia.ouvindo && S.ia.rec) { S.ia.rec.stop(); return; }
  const rec = new SR(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = true;
  let base = S.ia.instrucao ? S.ia.instrucao.trim() + ' ' : '';
  rec.onresult = e => {
    let final = '', parcial = '';
    for (let i = 0; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) final += r[0].transcript + ' '; else parcial += r[0].transcript; }
    S.ia.instrucao = (base + final + parcial).trim();
    const inp = $('#iaInstr'); if (inp) inp.value = S.ia.instrucao;
  };
  rec.onend = () => { S.ia.ouvindo = false; S.ia.rec = null; const b = $('#iaMic'); if (b) b.classList.remove('on'); };
  rec.onerror = ev => { S.ia.ouvindo = false; S.ia.rec = null; renderDetalhe(); if (ev.error !== 'no-speech' && ev.error !== 'aborted') toast('Ditado: ' + ev.error, true); };

  }
  return data || {};
}

    if (S.env !== e) return;
    e.carregando = false;
    if (r.erro) { e.erro = r.erro; if (r.precisa_confirmacao) e.precisaConf = true; renderDetalhe(); return; }
    e.resultado = r; toast('E-mail enviado: ' + r.para); renderDetalhe();
  };
}

/* ---------- conhecimento da IA ---------- */
async function abrirConhecimento() {
  S.modal = { novoTema: 'entrega', novoTexto: '', carregando: true };
  renderModal();
  const { data, error } = await sb.from('ia_conhecimento').select('id,tema,texto,atualizado_em,atualizado_por').eq('ativo', true).order('tema').order('id');
  S.modal.carregando = false; S.conhecimento = error ? [] : data; if (error) toast(error.message, true);
  renderModal();
}
function renderModal() {
  const el = $('#modal'); if (!S.modal) { el.innerHTML = ''; return; }
  const m = S.modal, lista = S.conhecimento || [];
  const temas = ['entrega', 'produto', 'pagamento', 'reembolso', 'empresa', 'canais', 'problemas conhecidos', 'geral'];
  el.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal">
    <div class="row"><h2 class="grow">O que a IA sabe sobre a empresa</h2><button class="small" id="mFechar">Fechar</button></div>
    <div class="small muted" style="margin-bottom:10px">Fatos, não regras de escrita (as regras estão fixas no prompt). Tudo aqui entra em toda sugestão. Escreva como explicaria para um funcionário novo.</div>
    <div class="block" style="margin:8px 0"><div class="form-grid">
      <div><label class="lbl">Tema</label><select id="mTema">${temas.map(t => `<option ${m.novoTema === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div style="grid-column:1/-1"><label class="lbl">Fato novo</label><textarea id="mTexto" style="min-height:70px" placeholder="Ex.: Quando a pessoa manda o e-mail e a compra é válida, mandamos o link da thank you e reenviamos o e-mail com os arquivos.">${esc(m.novoTexto)}</textarea></div>
    </div><div class="row" style="margin-top:8px"><button class="primary" id="mSalvar">Adicionar</button></div></div>
    ${m.carregando ? '<div class="notice">Carregando…</div>' : lista.map(k => `<div class="fato"><span class="tema">${esc(k.tema)}</span><span class="tx">${esc(k.texto)}</span><button class="small danger" data-del="${k.id}" title="remover">×</button></div>`).join('')}
  </div></div>`;
  $('#mFechar').onclick = () => { S.modal = null; renderModal(); };
  $('#mbg').onclick = e => { if (e.target.id === 'mbg') { S.modal = null; renderModal(); } };
  $('#mTema').onchange = e => m.novoTema = e.target.value;
  $('#mTexto').oninput = e => m.novoTexto = e.target.value;
  $('#mSalvar').onclick = async () => {
    if (!m.novoTexto.trim()) return toast('Escreva o fato.', true);
    const { error } = await sb.rpc('salvar_conhecimento', { p_id: null, p_tema: m.novoTema, p_texto: m.novoTexto });
    if (error) return toast(error.message, true);
    toast('Adicionado. Vale a partir da próxima sugestão.'); m.novoTexto = ''; abrirConhecimento();
  };
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('Remover este fato do conhecimento da IA?')) return; const { error } = await sb.rpc('apagar_conhecimento', { p_id: Number(b.dataset.del) }); if (error) return toast(error.message, true); abrirConhecimento(); });
}

/* ---------- conversa ---------- */
// Inbox e comentário são conversas diferentes: a pessoa escreveu em público (comentário)
// ou em privado (DM/Messenger). A tela mostra os dois separados e, embaixo, tudo junto
// na ordem em que aconteceu — para ver o caminho inteiro da pessoa.
const ehComentario = c => /coment/.test(String(c || ''));
function msgsThread() {
  const msgs = (S.thread || []).map(m => ({ t: m.criado_em, dir: m.direcao, texto: m.texto, pt: m.texto_pt, canal: m.canal, cat: m.categoria, id: m.mensagem_id, marca: m.marca, apagado: m.apagado_em }));
  (S.ficha?.fila || []).forEach(fr => msgs.push({ t: fr.enviado_em || fr.criado_em, dir: 'saida', texto: fr.texto, canal: fr.canal, fila: fr }));
  msgs.sort((a, b) => new Date(a.t) - new Date(b.t));
  return msgs;
}
function bolhasHtml(msgs, comTag) {
  const ehComentarioApagavel = m => m.dir === 'entrada' && (m.canal === 'comentario' || m.canal === 'comentario_fb') && m.id && (/^[0-9]{15,20}$/.test(m.id) || /^[0-9]+_[0-9]+$/.test(m.id));
  let dia = '', h = '';
  for (const m of msgs) {
    const d = fmtDataLonga(m.t); if (d !== dia) { dia = d; h += `<div class="day">${esc(d)}</div>`; }
    const vazio = !m.texto || !String(m.texto).trim();
    const cls = m.dir === 'entrada' ? 'in' : 'out';
    const extra = (m.fila ? (m.fila.enviado_em ? 'fila' : 'pend') : '') + (ehComentario(m.canal) ? ' com' : '');
    const tag = comTag ? `<span class="ch">${logoCanal(m.canal)} ${ehComentario(m.canal) ? ICO.com + ' comentário' : ICO.dm + ' inbox'}</span>` : '';
    let meta = `${fmtHora(m.t)} · ${canalTxt(m.canal)}${m.cat ? ' · ' + esc(m.cat) : ''}`;
    if (m.dir === 'saida' && (m.canal === 'comentario' || m.canal === 'comentario_fb') && /^(Ecco tutto quello che ti serve|Aquí va todo lo que necesitas|Here is everything you need|Vi tu comentario y prefiero|I saw your comment and I would rather|Ho visto il tuo commento e preferisco)/.test(String(m.texto || ''))) meta += ` · <b>🔒 privada, foi para o DM</b>`;
    if (m.apagado) meta += ` · <b style="color:var(--danger)">🗑 apagado ${fmtDataHora(m.apagado)}</b>`;
    else if (ehComentarioApagavel(m)) meta += ` <button class="apagar" data-apagar="${esc(m.id)}" data-canal="${esc(m.canal)}" data-marca="${esc(m.marca || '')}" title="Apagar este comentário na Meta (não dá para desfazer)">🗑 apagar</button>`;
    if (m.fila) meta += ` · fila #${esc(m.fila.id)}${m.fila.origem ? ' · ' + esc(m.fila.origem) : ''}` + (m.fila.enviado_em ? ` · enviada${m.fila.resultado && m.fila.resultado !== 'ok' ? ' · <b style="color:var(--danger)">FALHOU: ' + esc(m.fila.resultado) + '</b>' : ''}` : ` · <b>ainda não enviada</b> <button class="small danger" data-cancelar="${esc(m.fila.id)}">cancelar</button>`);
    if (vazio && m.dir === 'entrada') h += `<div class="msg in midia${ehComentario(m.canal) ? ' com' : ''}">${tag}📎 Mídia sem texto (imagem, print ou áudio). Só dá para ver no Instagram.<span class="m">${meta}</span></div>`;
    else h += `<div class="msg ${cls} ${extra} ${m.apagado ? 'apagada' : ''}">${tag}${esc(m.texto)}${m.dir === 'entrada' && m.pt && m.pt.trim() !== String(m.texto).trim() ? `<span class="pt">${BR} ${esc(m.pt)}</span>` : ''}<span class="m">${meta}</span></div>`;
  }
  return h || `<div class="muted small">Nenhuma mensagem gravada.</div>`;
}
function threadHtml() { return bolhasHtml(msgsThread(), false); }
function conversaHtml() {
  if (!S.thread) return `<div class="block"><h3>Conversa</h3><div class="muted small">Carregando…</div></div>`;
  const msgs = msgsThread();
  const dm = msgs.filter(m => !ehComentario(m.canal)), com = msgs.filter(m => ehComentario(m.canal));
  // só um canal: uma conversa só, sem coluna vazia nem linha do tempo repetida
  if (!dm.length || !com.length) {
    const soCom = !dm.length && com.length;
    return `<div class="block conv ${soCom ? 'conv-com' : 'conv-dm'}"><h3>${soCom ? ICO.com + ' Comentários' : ICO.dm + ' Inbox'} <span class="n">${msgs.length}</span> <span class="sub muted">· ${soCom ? 'em público, nos posts' : 'DM e Messenger, em privado'} · todas as marcas deste autor_id</span></h3><div class="thread">${bolhasHtml(msgs, false)}</div></div>`;
  }
  let h = `<div class="conv2">`;
  h += `<div class="block conv conv-dm"><h3>${ICO.dm} Inbox <span class="n">${dm.length}</span> <span class="sub muted">· DM e Messenger, em privado</span></h3><div class="thread">${bolhasHtml(dm, false)}</div></div>`;
  h += `<div class="block conv conv-com"><h3>${ICO.com} Comentários <span class="n">${com.length}</span> <span class="sub muted">· em público, nos posts</span></h3><div class="thread">${bolhasHtml(com, false)}</div></div>`;
  h += `</div>`;
  h += `<div class="block conv conv-tudo"><h3>🕒 Tudo junto <span class="n">${msgs.length}</span> <span class="sub muted">· inbox e comentários na ordem em que aconteceram — o caminho inteiro da pessoa</span></h3><div class="thread">${bolhasHtml(msgs, true)}</div></div>`;
  return h;
}

iniciar();
</script>
